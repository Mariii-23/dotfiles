[bar/template]
width = 100%
height = 19
;offset-x = 1%
;offset-y = 1%
radius = 6.0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1
line-color = #f00

border-size = 4
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin-left = 1
module-margin-right = 1

; font-0 = Hack-Bold:size:10;2

; font-0 = fixed:pixelsize=13;1
; font-1 = FontAwesome6Free:style=Solid:size=11;2
; font-2 = FontAwesome6Free:style=Regular:size=11:antialias=true
; font-3 = FontAwesome6Brands:style=Regula:size=11:antialias=true
; font-4 = unifont:fontformat=truetype:size=11:antialias=false;0
; font-5 = siji:pixelsize=11;1
font-0 = "Noto Sans:style=Regular:pixelsize=13;1"
font-1 = "Font Awesome 7 Free Solid:pixelsize=13;2"
font-2 = "Font Awesome 7 Free:style=Regular:pixelsize=13;2"
font-3 = "Font Awesome 7 Brands:style=Regular:pixelsize=13;2"
font-4 = "Siji:pixelsize=11;1"

separator = " "
tray-position = right
tray-padding = 2

cursor-click = pointer
cursor-scroll = ns-resize

; Default module layout (can be overridden per monitor)
modules-left = Herbstluftwm spotify2
modules-center = date phrase
modules-right = mic pulseaudio battery memory cpu temperature

